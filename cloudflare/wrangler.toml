name = "qt-research-workbench"
main = "../web/edge/worker.ts"
compatibility_date = "2026-09-07"

# Public entry is the custom domain only. workers.dev is disabled so there is
# a single hostname and a single Cloudflare Access application to reason about.
workers_dev = false
routes = [
  { pattern = "qt.xvis.cc", custom_domain = true },
]

[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Static assets must pass through the Worker on previews, workers.dev, and
# production. Otherwise an unauthenticated request could bypass Access JWT
# verification by fetching a static SPA file directly.
run_worker_first = true

[[r2_buckets]]
binding = "REPORTS"
bucket_name = "qt-research-reports"

[vars]
ACCESS_JWT_ISSUER = "https://dry-disk-7ba3.cloudflareaccess.com"
# AUD tag of the Access application whose domain is qt.xvis.cc
# (Zero Trust -> Access -> Applications -> <app> -> Overview -> Application Audience).
# The Worker rejects tokens whose audience does not match, so the old
# workers.dev application's AUD will NOT work here.
ACCESS_JWT_AUDIENCE = "REPLACE_WITH_QT_XVIS_CC_ACCESS_AUD"
# Browser and API share this hostname (the SPA calls relative /api/v3/...);
# the origin below is never exposed to users.
ORIGIN_URL = "https://101.32.243.66.sslip.io"
MAX_API_BODY_BYTES = "1048576"

# Configure these secrets only with `wrangler secret put`, never in Git:
# ORIGIN_CLIENT_ID
# ORIGIN_CLIENT_SECRET
