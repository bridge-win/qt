name: Deploy TC

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qt-tc-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: tc-production
      url: https://qt.eatfear.com
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Test and build frontend
        working-directory: web
        run: |
          npm ci
          npm test
          npm run build
      - name: Install research test dependencies
        run: |
          python -m pip install -e 'packages/btc-backtest[dev]'
          python -m pip install -e '.[dev,native-research,r2-publish]'
      - name: Validate receiver and native research
        run: |
          ruff check deploy/tc_receive.py tests/deploy
          pytest -q tests/deploy tests/nautilus tests/test_workbench*.py tests/test_provenance.py tests/test_cycle_and_overheat.py tests/lab/test_lab_service.py
      - name: Package tested source and built assets
        run: |
          mkdir -p "$RUNNER_TEMP/qt-release"
          git archive HEAD src scripts config packages pyproject.toml README.md | tar -x -C "$RUNNER_TEMP/qt-release"
          mkdir -p "$RUNNER_TEMP/qt-release/web"
          cp -R web/dist "$RUNNER_TEMP/qt-release/web/dist"
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'qt-release/release.json'
          path.write_text(json.dumps({'sha': os.environ['GITHUB_SHA']}))
          PY
          tar -czf "$RUNNER_TEMP/qt-release.tar.gz" -C "$RUNNER_TEMP/qt-release" src scripts config packages pyproject.toml README.md web release.json
      - name: Deploy current main through restricted SSH receiver
        env:
          GH_TOKEN: ${{ github.token }}
          TC_SSH_PRIVATE_KEY: ${{ secrets.TC_SSH_PRIVATE_KEY }}
          TC_SSH_KNOWN_HOSTS: ${{ secrets.TC_SSH_KNOWN_HOSTS }}
          TC_HOST: ${{ vars.TC_HOST }}
        run: |
          set -euo pipefail
          latest="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          if [ "$latest" != "$GITHUB_SHA" ]; then
            echo "Newer main exists; skipping superseded release $GITHUB_SHA"
            exit 0
          fi
          test -n "$TC_SSH_PRIVATE_KEY"
          test -n "$TC_SSH_KNOWN_HOSTS"
          test -n "$TC_HOST"
          umask 077
          key="$RUNNER_TEMP/qt-deploy-key"
          hosts="$RUNNER_TEMP/qt-known-hosts"
          trap 'rm -f "$key" "$hosts"' EXIT
          printf '%s\n' "$TC_SSH_PRIVATE_KEY" > "$key"
          printf '%s\n' "$TC_SSH_KNOWN_HOSTS" > "$hosts"
          ssh -T -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$hosts" \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=20 \
            "root@$TC_HOST" "deploy $GITHUB_SHA $GITHUB_RUN_ID" < "$RUNNER_TEMP/qt-release.tar.gz"
          echo "### Deployed $GITHUB_SHA to https://qt.eatfear.com" >> "$GITHUB_STEP_SUMMARY"
