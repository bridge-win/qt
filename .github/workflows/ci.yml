name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel packages/btc-backtest
          python -m build --wheel .
          pip install -e packages/btc-backtest
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Test
        run: pytest -q

  platform-postgresql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.9-bookworm@sha256:47f917f7409eacd22fc5dfb1dee634e1b55cf0c01d1a7eb701be2227a03e0641
        env:
          POSTGRES_DB: qt_test
          POSTGRES_USER: qt_test
          POSTGRES_PASSWORD: qt_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qt_test -d qt_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel packages/btc-backtest
          python -m build --wheel .
          pip install -e packages/btc-backtest
          pip install -e ".[dev]"
      - name: PostgreSQL integration tests
        env:
          QT_TEST_POSTGRES_URL: postgresql+psycopg://qt_test:qt_test_only@127.0.0.1:5432/qt_test
        run: pytest tests/integration -q

  platform-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: amd64,arm64
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Validate deployment configuration
        run: |
          docker compose --env-file .env.platform.example -f docker-compose.platform.yml config --quiet
          docker compose --env-file .env.platform.example -f docker-compose.platform.yml -f docker-compose.platform.local.yml config --quiet
      - name: Build hash-locked deployment image for both production architectures
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --file Dockerfile.platform \
            --output type=cacheonly \
            .
