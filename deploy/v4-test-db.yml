name: qt-v4-test-db
services:
  postgres:
    image: postgres:17.9-bookworm@sha256:47f917f7409eacd22fc5dfb1dee634e1b55cf0c01d1a7eb701be2227a03e0641
    restart: "no"
    environment:
      POSTGRES_USER: qt_v4_test
      POSTGRES_DB: qt_v4_test
      POSTGRES_PASSWORD: ${QT_V4_TEST_POSTGRES_PASSWORD:?Run v4-init}
      POSTGRES_INITDB_ARGS: --data-checksums
    ports: ["127.0.0.1:${QT_V4_TEST_DB_PORT:-55439}:5432"]
    tmpfs: ["/var/lib/postgresql/data:size=512m,mode=0700"]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U qt_v4_test -d qt_v4_test"]
      interval: 2s
      timeout: 5s
      retries: 30
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 128
