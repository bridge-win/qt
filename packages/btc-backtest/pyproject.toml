[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "btc-backtest"
version = "0.1.0"
description = "Independent, reproducible Bitcoin backtesting engine"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "httpx>=0.27",
    "jinja2>=3.1",
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14",
    "pydantic>=2.5",
    "rich>=13.7",
    "scipy>=1.11",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "build>=1.2.2",
    "hypothesis>=6.100",
    "mypy>=1.10",
    "pytest>=8",
    "pytest-httpx>=0.30",
    "ruff>=0.4",
]
exchanges = ["ccxt>=4.2"]

[project.scripts]
btc-backtest = "btc_backtest.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"btc_backtest.reporting.templates" = ["*.j2"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as requiring network",
    "performance: marks performance budget tests",
]
